.deck{position:absolute;inset:0;display:flex;flex-direction:column;gap:.9cqw;padding:1.2cqw 2.2cqw 1.6cqw 11cqw}
.top{display:flex;justify-content:space-between;align-items:center;gap:1cqw}
h1{font-family:'Baloo 2',Nunito,sans-serif;font-weight:700;font-size:2.6cqw;line-height:1.1;margin:0;background:var(--card);border:max(2px,.22cqw) solid var(--ink);border-radius:99px;padding:.2cqw 1.6cqw;transform:rotate(-1deg);box-shadow:0 .25cqw 0 var(--ink)}
.tools{display:flex;align-items:center;gap:.8cqw}
#steps{display:flex;gap:.5cqw}
.pl{font-family:'Baloo 2',Nunito,sans-serif;font-weight:500;font-size:1.05cqw;padding:.1cqw .9cqw;border:max(2px,.2cqw) solid var(--ink);border-radius:99px;background:var(--card);color:var(--ink2);white-space:nowrap}
.pl.on{background:var(--btn);color:#fff;transform:rotate(-2deg)}
.pl.ok{background:var(--ball);color:#0B2A4A}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.5cqw}
.col{display:flex;flex-direction:column;gap:1.1cqw;min-height:0}
.card{background:var(--card);border:max(2px,.25cqw) solid var(--ink);border-radius:1.5cqw;box-shadow:0 .35cqw 0 var(--ink);padding:.9cqw 1.2cqw}
.coach{display:flex;gap:1.2cqw;align-items:flex-start}
#mas{width:6.5cqw;flex:none}
#mas.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-1cqw) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bub{position:relative;flex:1;background:var(--paper);border:max(2px,.2cqw) solid var(--ink);border-radius:1.2cqw;padding:.7cqw 1.1cqw}
.bub:before{content:"";position:absolute;left:-.8cqw;top:1.8cqw;width:1.2cqw;height:1.2cqw;background:var(--paper);border-left:max(2px,.2cqw) solid var(--ink);border-bottom:max(2px,.2cqw) solid var(--ink);transform:rotate(45deg)}
#story{margin:0 0 .3cqw;font-size:1.05cqw;line-height:1.45;color:var(--ink2)}
#ask{margin:0;font-weight:700;font-size:1.3cqw;line-height:1.4}
#eqw{display:flex;align-items:baseline;gap:.8cqw;margin:.2cqw .4cqw 0}
#eq{font-family:'Baloo 2',Nunito,sans-serif;font-weight:700;font-size:2.4cqw}
.hint{font-size:.95cqw;color:var(--ink2)}
#log{background:var(--paper);border:max(2px,.2cqw) dashed var(--ink2);border-radius:1cqw;padding:.4cqw 1cqw;display:grid;grid-template-columns:1fr 1fr;column-gap:1cqw;min-height:3cqw}
.lg{display:flex;gap:.6cqw;align-items:baseline;font-size:1.05cqw;line-height:2.1cqw;border-bottom:1px dotted var(--line)}
.lg b{font-family:'Baloo 2',Nunito,sans-serif;font-size:1.25cqw;font-weight:700}
.lg span{color:var(--ink2)}
.lg.w{grid-column:1/-1}
#ctl{display:flex;flex-wrap:wrap;gap:.8cqw}
button{font-family:'Baloo 2',Nunito,sans-serif;font-weight:500;font-size:1.25cqw;color:#fff;background:var(--btn);border:max(2px,.22cqw) solid var(--ink);border-radius:1cqw;box-shadow:0 .3cqw 0 var(--ink);padding:.3cqw 1.2cqw;cursor:pointer;min-height:3.3cqw}
button:active{transform:translateY(.25cqw);box-shadow:0 .05cqw 0 var(--ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ball2);outline-offset:2px}
button.alt{background:var(--btn2)}
button.ghost{background:var(--card);color:var(--ink);box-shadow:none;min-height:2.4cqw;font-size:1cqw;border-width:max(2px,.18cqw)}
select{font:inherit;font-size:1.1cqw;font-weight:700;color:var(--ink);background:var(--card);border:max(2px,.2cqw) solid var(--ink);border-radius:.8cqw;padding:.15cqw .6cqw;min-height:2.6cqw}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:.6cqw;width:100%;font-size:1.1cqw;line-height:1.35;padding:.2cqw 0}
#fb{margin-top:.8cqw;min-height:1.8cqw;font-weight:700;font-size:1.15cqw;line-height:1.4}
#fb.ok{color:var(--ok)}#fb.bad{color:var(--bad)}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf,#mas.hop{animation:none}}
.bx{fill:var(--box);stroke:var(--ink);stroke-width:2.5}.b1{fill:var(--ball);stroke:var(--ink);stroke-width:1.8}.b2{fill:var(--ball2);stroke:var(--ink);stroke-width:1.8}
.bt{font-family:'Baloo 2',Nunito,sans-serif;font-weight:700;font-size:20px;fill:#fff}
.lbl{font-size:12px;fill:var(--ink2);font-weight:700}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex;position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--ink);align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;font-weight:700}}
</style>
</head>
<body>
<div class="deckw"><div class="deck">
<header class="top"><h1>Misi Timbangan Si Kotak</h1><div class="tools"><div id="steps"></div><button id="rs" class="ghost">Ulangi</button></div></header>
<div class="grid">
<div class="col">
<div class="card stage">
<svg id="sc" viewBox="0 0 680 300" width="100%" role="img" aria-label="Timbangan dengan kotak misterius dan bola"><g id="dyn"></g></svg>
<div id="eqw"><span id="eq"></span><span class="hint">angka dalam ribuan rupiah</span></div>
</div>
<div class="card"><div id="log" aria-live="polite"></div></div>
</div>
<div class="col">
<div class="card"><div class="coach">
<svg id="mas" viewBox="0 0 80 80" aria-hidden="true"><rect x="12" y="26" width="56" height="46" rx="9" class="bx"/><rect x="7" y="14" width="66" height="16" rx="7" class="bx"/><path d="M40 14v16" stroke="#12305E" stroke-width="2.5"/><circle cx="29" cy="47" r="4.5" fill="#fff"/><circle cx="51" cy="47" r="4.5" fill="#fff"/><circle cx="22" cy="56" r="4" fill="#FF9DB8"/><circle cx="58" cy="56" r="4" fill="#FF9DB8"/><path id="mth" d="M33 58q7 8 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
<div class="bub"><p id="story"></p><p id="ask"></p></div>
</div></div>
<div class="card"><div id="ctl"></div><div id="fb" role="status"></div></div>
</div>
</div>
</div></div>
<div id="rot">Putar layar ke posisi landscape ya</div>
<script>
var S,dyn=document.getElementById('dyn'),NAMES=['Memahami','Merencanakan','Melaksanakan','Memeriksa','Temukan pola'];
function $(i){return document.getElementById(i)}
function clamp(v,a,c){return Math.max(a,Math.min(c,v))}
function init(){S={st:0,b:2,l:6,r:20,fill:0,unk:true,showEq:false,log:[],th:0,err:0}}
function lw(){return S.b*(S.fill||7)+S.l}
function tgt(dl,dr){return clamp((lw()+dl-(S.r+dr))*1.5,-14,14)}
function expr(){var t='';if(S.b>0)t+=(S.b>1?S.b:'')+'x';if(S.l>0)t+=(t?' + ':'')+S.l;return t||'0'}
function leftItems(){var a=[],i;if(S.fill>0){for(i=0;i<S.b*S.fill;i++)a.push('f')}else{for(i=0;i<S.b;i++)a.push('b')}for(i=0;i<S.l;i++)a.push('o');return a}
function rightItems(){var a=[];for(var i=0;i<S.r;i++)a.push('o');return a}
function pan(cx,py,arr){
 var boxes=arr.filter(function(t){return t==='b'}).length,balls=arr.filter(function(t){return t!=='b'}),s='',i;
 if(boxes>0){var bw=42,g=6,sx=cx-(boxes*bw+(boxes-1)*g)/2;
  for(i=0;i<boxes;i++){var bx=sx+i*(bw+g);s+='<rect x="'+bx+'" y="'+(py-38)+'" width="'+bw+'" height="34" rx="6" class="bx"/><text class="bt" x="'+(bx+bw/2)+'" y="'+(py-21)+'" text-anchor="middle" dominant-baseline="central">'+(S.unk?'?':'x')+'</text>'}}
 var base=py-6-(boxes>0?36:0);
 for(i=0;i<balls.length;i++){var row=Math.floor(i/7),col=i%7,n=Math.min(7,balls.length-row*7),x=cx-(n-1)*21/2+col*21,y=base-8-row*19;
  s+='<circle class="'+(balls[i]==='f'?'b2':'b1')+'" cx="'+x+'" cy="'+y+'" r="8.5"/><circle cx="'+(x-2.5)+'" cy="'+(y-3)+'" r="2.2" fill="#fff" opacity=".7"/>'}
 return s}
function draw(th){
 var r=th*Math.PI/180,c=Math.cos(r),s=Math.sin(r),h=150;
 var lx=340-h*c,ly=50+h*s,rx=340+h*c,ry=50-h*s,lp=ly+120,rp=ry+120;
 var o='<path d="M340 50L300 292H380Z" style="fill:var(--paper);stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round"/>';
 o+='<line x1="'+lx+'" y1="'+ly+'" x2="'+rx+'" y2="'+ry+'" style="stroke:var(--ink);stroke-width:8;stroke-linecap:round"/>';
 [[lx,ly,lp],[rx,ry,rp]].forEach(function(p){
  o+='<path d="M'+(p[0]-82)+' '+p[2]+'L'+p[0]+' '+p[1]+'L'+(p[0]+82)+' '+p[2]+'" fill="none" style="stroke:var(--ink);stroke-width:2"/>';
  o+='<rect x="'+(p[0]-88)+'" y="'+p[2]+'" width="176" height="10" rx="5" style="fill:var(--plate);stroke:var(--ink);stroke-width:3"/>'});
 o+=pan(lx,lp,leftItems())+pan(rx,rp,rightItems());
 if(S.st<=1){o+='<text class="lbl" x="'+lx+'" y="'+(lp+30)+'" text-anchor="middle">2 buku + sisa uang</text><text class="lbl" x="'+rx+'" y="'+(rp+30)+'" text-anchor="middle">uang awal</text>'}
 o+='<circle cx="340" cy="50" r="10" style="fill:var(--sun);stroke:var(--ink);stroke-width:3"/>';
 dyn.innerHTML=o}
function anim(to,cb){var from=S.th,t0=null;function f(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/500),e=1-Math.pow(1-p,3);S.th=from+(to-from)*e;draw(S.th);if(p<1)requestAnimationFrame(f);else if(cb)cb()}requestAnimationFrame(f)}
function render(){
 var st=$('steps');st.innerHTML='';
 NAMES.forEach(function(n,i){var d=document.createElement('span');d.className='pl'+(i===S.st?' on':'')+(i<S.st?' ok':'');d.textContent=(i<S.st?'\u2713 ':'')+n;st.appendChild(d)});
 $('eq').textContent=S.showEq?(expr()+' = '+S.r):'Persamaan belum ditulis';
 var lg=$('log');lg.innerHTML='';
 if(!S.log.length){var e=document.createElement('div');e.className='lg w';e.innerHTML='<span>Buku catatanmu masih kosong.</span>';lg.appendChild(e)}
 S.log.forEach(function(l){var d=document.createElement('div');d.className='lg'+(l.w?' w':'');d.innerHTML='<b></b><span></span>';d.children[0].textContent=l.e;d.children[1].textContent=l.n;lg.appendChild(d)});
 draw(S.th)}
function mood(k){$('mth').setAttribute('d',k==='ok'?'M31 56q9 12 18 0':k==='bad'?'M33 64q7-8 14 0':'M34 60h12');var m=$('mas');m.classList.remove('hop');void m.offsetWidth;if(k)m.classList.add('hop')}
function say(t,k){var f=$('fb');f.textContent=t;f.className=k||'';mood(k||'');if(k==='bad')S.err++}
function boom(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var cols=['#2F7BEF','#6FD3F5','#9AA7FF','#FFC94D'];for(var i=0;i<44;i++){var s=document.createElement('span');s.className='cf';s.style.left=Math.random()*100+'vw';s.style.background=cols[i%4];s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()},3600,s)}}
function setBtns(a){var c=$('ctl');c.innerHTML='';a.forEach(function(x){var b=document.createElement('button');b.textContent=x[0];if(x[2])b.className=x[2];b.onclick=x[1];c.appendChild(b)})}
function Q(story,ask){$('story').textContent=story;$('ask').textContent=ask}
function s0(){S.st=0;render();Q('Aisyah membawa uang Rp20.000. Ia membeli 2 buku tulis seharga sama, sisa uangnya Rp6.000. Satu bola = Rp1.000.','Halo, aku Si Kotak. Menurutmu, aku mewakili apa?');say('');
 setBtns([['Uang awal Aisyah',function(){say('Uang awalnya sudah diketahui: 20 bola di kanan. Cari yang masih rahasia.','bad')}],
 ['Harga satu buku tulis',function(){say('Tepat! Isi kotak = harga satu buku, belum diketahui. Kita namai x.','ok');setBtns([['Lanjut: tulis persamaan',s1,'alt']])}],
 ['Sisa uang Aisyah',function(){say('Sisa uangnya sudah diketahui: 6 bola di samping kotak.','bad')}]])}
function s1(){S.st=1;S.unk=false;render();Q('Sekarang kotak bernama x. Coba hitung isi kiri dan kanan timbangan.','Persamaan mana yang cocok dengan timbangan ini?');say('');
 function ok(){S.showEq=true;S.log=[{e:'2x + 6 = 20',n:'persamaan awal'}];render();say('Betul. Kiri: 2 kotak dan 6 bola. Kanan: 20 bola.','ok');setBtns([['Lanjut: cari nilai x',s2,'alt']])}
 function no(){say('Hitung lagi: kiri adalah 2 kotak ditambah bola di sebelahnya, kanan adalah semua bola.','bad')}
 setBtns([['2x \u2212 6 = 20',no],['2x + 6 = 20',ok],['2x = 20 + 6',no]])}
function s2(){S.st=2;render();Q('Misi: biarkan aku sendirian di satu sisi, tanpa membuat timbangan miring.','Ambil bola sedikit demi sedikit. Coba berbagai cara, lalu amati.');say('');ph0()}
function ph0(){setBtns([['Ambil 1 bola: kiri saja',function(){take('L')}],['Ambil 1 bola: kanan saja',function(){take('R')}],['Ambil 1 bola: kedua sisi',function(){take('B')}]])}
function take(side){
 if(S.l<=0)return;
 if(side==='B'){S.l--;S.r--;S.log.push({e:expr()+' = '+S.r,n:'\u22121 di kedua sisi'});render();anim(tgt(0,0));
  if(S.l===0){say('Aku sudah bebas dari bola. Tapi aku masih berdua.','ok');Q('Sekarang 2 kotak sama dengan 14 bola.','Bagaimana caranya agar tinggal 1 kotak?');ph1()}
  else say('Kiri jadi '+expr()+', kanan jadi '+S.r+'. Apa yang sama, apa yang berubah?')}
 else{var dl=side==='L'?-1:0,dr=side==='R'?-1:0;anim(tgt(dl,dr),function(){say('Wah, timbangannya miring! Kiri dan kanan tidak sama lagi, jadi bukan persamaan.','bad');setTimeout(function(){anim(tgt(0,0))},1000)})}}
function ph1(){setBtns([['Bagi kiri saja jadi 2 kelompok',function(){anim(clamp((7-14)*1.5,-14,14),function(){say('Miring! Kiri jadi 7, kanan masih 14.','bad');setTimeout(function(){anim(0)},1000)})}],
 ['Bagi kedua sisi jadi 2 kelompok',function(){S.b=1;S.r=7;S.log.push({e:'x = 7',n:'dibagi 2 di kedua sisi'});render();anim(0);say('Seimbang! 1 kotak = 7 bola, jadi x = 7.','ok');setBtns([['Lanjut: periksa jawaban',s3,'alt']])}],
 ['Tambah 2 bola di kedua sisi',function(){say('Kotaknya tetap dua. Pikirkan cara membuat 2 kotak jadi 1.','bad')}]])}
function s3(){S.st=3;S.b=2;S.l=6;S.r=20;S.fill=0;render();anim(0);Q('Kamu menemukan x = 7. Tapi apakah benar?','Kita kembali ke timbangan awal. Isi tiap kotak dengan bola, berapa yang pas?');say('');
 function tryv(v){S.fill=v;S.b=2;S.l=6;S.r=20;render();anim(tgt(0,0),function(){
  if(v===7){S.log.push({e:'2(7) + 6 = 20 \u2192 20 = 20',n:'diperiksa: timbangan seimbang',w:1});render();say('Seimbang! Jawabanmu terbukti benar.','ok');boom();concl()}
  else say('2('+v+') + 6 = '+(2*v+6)+', bukan 20. Timbangan miring.','bad')})}
 setBtns([['Isi tiap kotak 6 bola',function(){tryv(6)}],['Isi tiap kotak 7 bola',function(){tryv(7)}],['Isi tiap kotak 8 bola',function(){tryv(8)}]])}
function concl(){Q('Timbangan seimbang saat tiap kotak berisi 7 bola.','Kesimpulan apa yang sesuai dengan cerita Aisyah?');
 setBtns([['Harga satu buku tulis Rp7.000',function(){say('Tepat. Satu buku Rp7.000, dua buku Rp14.000, ditambah sisa Rp6.000 sama dengan Rp20.000.','ok');setBtns([['Lanjut: temukan polanya',s4,'alt']])}],
 ['Harga dua buku Rp7.000',function(){say('Rp7.000 itu isi satu kotak. Dua buku berapa?','bad')}],
 ['Aisyah membeli 7 buku',function(){say('Aisyah membeli 2 buku. Angka 7 adalah harga satu buku.','bad')}]])}
var PAT=[['Di kiri ada +6. Supaya hilang, aku','6 di kedua sisi.',['tambah','kurangi','kali','bagi'],'kurangi'],
 ['Ada 2 kotak (2x). Supaya tinggal 1 kotak, aku','kedua sisi dengan 2.',['tambah','kurangi','kali','bagi'],'bagi'],
 ['Apa pun yang kulakukan di kiri, di kanan harus','.',['dilakukan juga','dibiarkan','dibalik'],'dilakukan juga'],
 ['Tebak: pada 3x \u2212 4 = 11, langkah pertamaku','4 di kedua sisi.',['tambah','kurangi','kali','bagi'],'tambah']];
function s4(){S.st=4;render();Q('Lihat lagi buku catatanmu. Ada yang berulang di setiap langkah.','Lengkapi kalimat ini dengan polamu sendiri.');say('');var c=$('ctl');c.innerHTML='';
 PAT.forEach(function(p,i){var d=document.createElement('div');d.className='prow';var a=document.createElement('span');a.textContent=p[0];var sel=document.createElement('select');sel.id='p'+i;sel.setAttribute('aria-label','Jawaban kalimat '+(i+1));
  var o=document.createElement('option');o.value='';o.textContent='pilih';sel.appendChild(o);p[2].forEach(function(t){var op=document.createElement('option');op.value=t;op.textContent=t;sel.appendChild(op)});
  var b=document.createElement('span');b.textContent=p[1];var m=document.createElement('b');m.id='m'+i;sel.onchange=function(){m.textContent=''};d.appendChild(a);d.appendChild(sel);d.appendChild(b);d.appendChild(m);c.appendChild(d)});
 var bt=document.createElement('button');bt.textContent='Periksa pola';bt.className='alt';bt.onclick=chk;c.appendChild(bt)}
function chk(){var all=true,good=0,i;
 for(i=0;i<PAT.length;i++){if(!$('p'+i).value)all=false}
 if(!all){say('Pilih jawaban di setiap kalimat dulu.','');$('fb').className='bad';return}
 PAT.forEach(function(p,i){var v=$('p'+i).value,m=$('m'+i);if(v===p[3]){good++;m.textContent='benar';m.style.color='var(--ok)'}else{m.textContent='coba lagi';m.style.color='var(--bad)'}});
 if(good===PAT.length){S.st=5;render();var stars=S.err<=2?3:S.err<=5?2:1,sx='';for(var k=0;k<3;k++)sx+=k<stars?'\u2605':'\u2606';
  Q('Misi selesai! Nilai bintangmu: '+sx,'Polamu: lawan operasi yang menempel pada x, lalu lakukan di kedua sisi.');say('Kamu menemukan aturannya sendiri. Keren!','ok');boom();
  $('ctl').innerHTML='';var b=document.createElement('button');b.textContent='Main lagi';b.onclick=function(){init();s0()};$('ctl').appendChild(b)}
 else say('Ada yang belum pas. Bayangkan lagi timbangannya.','bad')}
$('rs').onclick=function(){init();s0()};
init();s0();
